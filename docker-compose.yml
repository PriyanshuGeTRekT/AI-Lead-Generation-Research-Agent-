services:
  lead-gen-api:
    build: .
    container_name: ai-lead-gen
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.1-8b-instant}
      - QUALIFICATION_THRESHOLD=${QUALIFICATION_THRESHOLD:-5.0}
      - CHROMA_PATH=/app/data/chroma_db
      - DATA_PATH=/app/data/leads.json
      - REDIS_URL=redis://redis:6379
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-ai-lead-gen}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - BASE_URL=${BASE_URL:-http://localhost:8000}
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ./data:/app/data
      - ./static:/app/static
      - ./agents:/app/agents
      - ./api:/app/api
      - ./cache:/app/cache
      - ./core:/app/core
      - ./graph:/app/graph
      - ./models:/app/models
      - ./notifications:/app/notifications
      - ./observability:/app/observability
      - ./rag:/app/rag
      - ./tools:/app/tools
      - ./worker.py:/app/worker.py
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: ai-lead-gen-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  celery_worker:
    build: .
    command: celery -A worker worker --loglevel=info --concurrency=2
    env_file: .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - REDIS_URL=redis://redis:6379
      - PYTHONPATH=/app
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./agents:/app/agents
      - ./api:/app/api
      - ./cache:/app/cache
      - ./core:/app/core
      - ./graph:/app/graph
      - ./models:/app/models
      - ./notifications:/app/notifications
      - ./observability:/app/observability
      - ./rag:/app/rag
      - ./tools:/app/tools
      - ./worker.py:/app/worker.py
    profiles:
      - full

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: leadgen
      POSTGRES_PASSWORD: leadgen
      POSTGRES_DB: leadgen
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadgen"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - full

volumes:
  redis_data:
  pgvector_data:
