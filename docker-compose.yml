services:
  lead-gen-api:
    build: .
    container_name: ai-lead-gen
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.1-8b-instant}
      - QUALIFICATION_THRESHOLD=${QUALIFICATION_THRESHOLD:-5.0}
      - CHROMA_PATH=/app/data/chroma_db
      - DATA_PATH=/app/data/leads.json
      - REDIS_URL=redis://redis:6379
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-ai-lead-gen}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
      - ./agents:/app/agents
      - ./api:/app/api
      - ./cache:/app/cache
      - ./core:/app/core
      - ./graph:/app/graph
      - ./observability:/app/observability
      - ./rag:/app/rag
      - ./tools:/app/tools
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: ai-lead-gen-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redis_data:
